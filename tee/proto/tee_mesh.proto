syntax = "proto3";

package proto;

option go_package = "github.com/rhombus-tech/vm/tee/proto";

import "google/protobuf/timestamp.proto";

// TeeMesh service manages direct communication between TEEs
service TeeMesh {
  // Discover allows TEEs to find each other within the same region
  rpc Discover(DiscoveryRequest) returns (DiscoveryResponse) {}
  
  // DirectExecute allows one TEE to directly execute operations on another
  rpc DirectExecute(DirectExecutionRequest) returns (DirectExecutionResponse) {}
  
  // ProxyExecute allows execution with automatic failover between TEEs
  rpc ProxyExecute(ProxyExecutionRequest) returns (DirectExecutionResponse) {}
  
  // BatchDirectExecute processes multiple operations in a single batch
  rpc BatchDirectExecute(BatchDirectExecutionRequest) returns (BatchDirectExecutionResponse) {}
  
  // BatchProxyExecute processes a batch with automatic failover between TEEs
  rpc BatchProxyExecute(BatchProxyExecutionRequest) returns (BatchDirectExecutionResponse) {}
  
  // Ping is a simple health check
  rpc Ping(PingRequest) returns (PingResponse) {}
  
  // Sync syncs state between TEEs
  rpc Sync(SyncRequest) returns (SyncResponse) {}
  
  // Heartbeat sends and receives TEE attestation and status updates
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse) {}
  
  // GetPeers retrieves a list of attested peers in the region
  rpc GetPeers(GetPeersRequest) returns (GetPeersResponse) {}
  
  // SyncOptimized provides an optimized state synchronization
  rpc SyncOptimized(SyncOptimizedRequest) returns (SyncOptimizedResponse) {}
  
  // GossipSync propagates updates between peers
  rpc GossipSync(GossipSyncMessage) returns (SyncOptimizedResponse) {}
}

// DiscoveryRequest contains information about the requesting TEE
message DiscoveryRequest {
  string tee_id = 1;        // ID of the requesting TEE
  string region_id = 2;     // Region ID
  string tee_type = 3;      // TEE type (SGX or SEV)
  string endpoint = 4;      // Network endpoint of the TEE
}

// DiscoveryResponse provides information about available TEEs
message DiscoveryResponse {
  repeated TEEPeer peers = 1;  // List of available TEEs in the region
}

// TEEPeer contains information about a single TEE
message TEEPeer {
  string tee_id = 1;        // Unique ID of the TEE
  string tee_type = 2;      // Type of TEE (SGX or SEV)
  string endpoint = 3;      // Network endpoint
  string region_id = 4;     // Region ID
  string status = 5;        // Status of the TEE (active, degraded, etc.)
}

// DirectExecutionRequest contains details for direct TEE-to-TEE execution
message DirectExecutionRequest {
  string sender_id = 1;     // ID of the requesting TEE
  string id_to = 2;         // Contract ID or object ID
  string function_call = 3; // Function to call
  bytes parameters = 4;     // Function parameters
  string region_id = 5;     // Region ID
  bool detailed_proof = 6;  // Whether to include detailed proof
  bytes expected_hash = 7;  // Expected state hash (optional)
  bool bypass_coordinator = 8; // Whether to bypass the regional coordinator
}

// ProxyExecutionRequest extends DirectExecutionRequest with failover options
message ProxyExecutionRequest {
  string sender_id = 1;     // ID of the requesting TEE
  string id_to = 2;         // Contract ID or object ID
  string function_call = 3; // Function to call
  bytes parameters = 4;     // Function parameters
  string region_id = 5;     // Region ID
  bool detailed_proof = 6;  // Whether to include detailed proof
  bytes expected_hash = 7;  // Expected state hash (optional)
  bool bypass_coordinator = 8; // Whether to bypass the regional coordinator
  
  // Failover specific fields
  string preferred_tee_type = 9; // Preferred TEE type (SGX, SEV)
  int32 max_retries = 10;        // Maximum number of retries
  int32 timeout_ms = 11;         // Timeout in milliseconds
  repeated string excluded_peers = 12; // TEE IDs to exclude
  bool cross_region_allowed = 13; // Whether cross-region execution is allowed
}

// DirectExecutionResponse contains the result of direct execution
message DirectExecutionResponse {
  string timestamp = 1;      // Execution timestamp
  bytes result = 2;          // Execution result
  bytes state_hash = 3;      // State hash after execution
  uint64 execution_time = 4; // Execution time in milliseconds
  uint64 memory_used = 5;    // Memory used during execution
  uint64 syscall_count = 6;  // Number of syscalls made
  uint64 network_latency_ns = 7; // Network latency in nanoseconds
  string sender_id = 8;      // ID of the TEE that executed the request
  bool success = 9;          // Whether execution was successful
}

// PingRequest is a simple ping message
message PingRequest {
  string sender_id = 1;     // ID of the sender
}

// PingResponse is a simple pong message
message PingResponse {
  string responder_id = 1;  // ID of the responder
  int64 timestamp_ns = 2;   // Timestamp in nanoseconds
}

// SyncRequest contains state sync information
message SyncRequest {
  string sender_id = 1;     // ID of the sender
  string object_id = 2;     // Object ID to sync
  bytes state_hash = 3;     // Current state hash
  int64 timestamp_ns = 4;   // Timestamp in nanoseconds
}

// SyncResponse contains sync result
message SyncResponse {
  bool success = 1;         // Whether sync was successful
  bytes state_hash = 2;     // New state hash
  int64 timestamp_ns = 3;   // Timestamp in nanoseconds
  bytes delta_updates = 4;  // Efficient binary diff for incremental state updates
}

// HeartbeatRequest sends attestation and status info to peers
message HeartbeatRequest {
  string sender_id = 1;     // ID of the sending TEE
  string tee_type = 2;      // Type of the TEE (SGX or SEV)
  string region_id = 3;     // Region ID
  string endpoint = 4;      // Network endpoint
  string timestamp = 5;     // Current timestamp
  AccumulatorWitness attestation = 6; // Attestation data
  bytes tls_certificate = 7; // TLS certificate for secure communication
}

// HeartbeatResponse confirms receipt of heartbeat
message HeartbeatResponse {
  string tee_id = 1;        // ID of the responding TEE
  string tee_type = 2;      // Type of the TEE
  string region_id = 3;     // Region ID
  string endpoint = 4;      // Network endpoint
  string timestamp = 5;     // Response timestamp
  AccumulatorWitness attestation = 6; // Attestation data
  bytes tls_certificate = 7; // TLS certificate for secure communication
  string status = 8;        // Status of the responding TEE
}

// GetPeersRequest requests a list of peers in the region
message GetPeersRequest {
  string tee_id = 1;       // ID of the requesting TEE
  string region_id = 2;    // Region to get peers for
  string tee_type = 3;     // Optional filter by TEE type
}

// GetPeersResponse returns a list of attested peers
message GetPeersResponse {
  repeated Peer peers = 1;  // List of peers in the region
}

// Peer contains information about an attested TEE peer
message Peer {
  string tee_id = 1;        // Unique ID of the TEE
  string tee_type = 2;      // Type of TEE (SGX or SEV)
  string region_id = 3;     // Region ID
  string endpoint = 4;      // Network endpoint
  string status = 5;        // Status of the peer (active, degraded, etc.)
  AccumulatorWitness attestation = 6; // Attestation witness
  bytes tls_certificate = 7; // TLS certificate for secure communication
}

// AccumulatorWitness contains attestation data from the accumulator
message AccumulatorWitness {
  bytes value = 1;               // Current witness value
  bytes last_accumulator = 2;    // Last known accumulator value
  AccumulatorElement element = 3; // Element for this TEE
  uint64 last_update = 4;        // Last update timestamp
}

// AccumulatorElement represents a single TEE in the accumulator
message AccumulatorElement {
  string executor = 1;           // Executor ID (TEE ID)
  bytes measurement = 2;         // TEE measurement
  string enclave_type = 3;       // Type of enclave (SGX, SEV)
  uint64 timestamp = 4;          // Timestamp when added
}

// BatchDirectExecutionRequest contains multiple DirectExecutionRequests to be executed as a batch
message BatchDirectExecutionRequest {
  string sender_id = 1;                                  // ID of the requesting TEE
  repeated BatchOperation operations = 2;                // Batch of operations to execute
  string region_id = 3;                                  // Region ID
  map<string, bytes> shared_parameters = 4;              // Parameters shared across multiple operations
  BatchOptions options = 5;                              // Batch execution options
}

// BatchOperation defines a single operation within a batch
message BatchOperation {
  string operation_id = 1;                               // Unique ID for this operation within the batch
  string id_to = 2;                                      // Contract ID or object ID
  string function_call = 3;                              // Function to call
  bytes parameters = 4;                                  // Function parameters (can reference shared parameters)
  bool detailed_proof = 5;                               // Whether to include detailed proof
  bytes expected_hash = 6;                               // Expected state hash (optional)
  repeated string parameter_references = 7;              // References to shared parameters
  repeated string dependencies = 8;                      // IDs of operations this one depends on
}

// BatchOptions defines options for executing a batch
message BatchOptions {
  BatchExecutionMode execution_mode = 1;                 // How to execute the batch
  BatchErrorHandling error_handling = 2;                 // How to handle errors in the batch
  uint32 max_concurrent_operations = 3;                  // Maximum parallel operations (0 = unlimited)
  bool preserve_order = 4;                               // Whether to preserve execution order
  uint32 timeout_ms = 5;                                 // Overall timeout in milliseconds
}

// BatchExecutionMode defines how a batch should be executed
enum BatchExecutionMode {
  BATCH_MODE_PARALLEL = 0;                               // Execute operations in parallel when possible
  BATCH_MODE_SEQUENTIAL = 1;                             // Execute operations in sequence
  BATCH_MODE_OPTIMIZED = 2;                              // Let the system optimize the execution plan
}

// BatchErrorHandling defines how errors should be handled within a batch
enum BatchErrorHandling {
  BATCH_ERROR_FAIL_FAST = 0;                             // Stop executing on first error
  BATCH_ERROR_CONTINUE = 1;                              // Continue executing other operations on error
  BATCH_ERROR_ROLLBACK = 2;                              // Attempt to roll back on error
}

// BatchDirectExecutionResponse contains results of batch execution
message BatchDirectExecutionResponse {
  bool overall_success = 1;                              // Whether the entire batch was successful
  repeated BatchOperationResult results = 2;             // Results for each operation
  uint64 total_execution_time_ns = 3;                    // Total execution time in nanoseconds
  uint64 batch_processing_overhead_ns = 4;               // Overhead from batch processing
  float compression_ratio = 5;                           // Network compression ratio achieved
  uint32 operations_succeeded = 6;                       // Number of successful operations
  uint32 operations_failed = 7;                          // Number of failed operations
  BatchStatistics statistics = 8;                        // Detailed statistics about the batch execution
}

// BatchOperationResult contains the result of a single operation within a batch
message BatchOperationResult {
  string operation_id = 1;                               // ID of the operation (matches request)
  string timestamp = 2;                                  // Execution timestamp
  bytes result = 3;                                      // Execution result
  bytes state_hash = 4;                                  // State hash after execution
  uint64 execution_time_ns = 5;                          // Execution time in nanoseconds
  uint64 memory_used = 6;                                // Memory used during execution
  uint64 syscall_count = 7;                              // Number of syscalls made
  string executor_id = 8;                                // ID of the TEE that executed the operation
  bool success = 9;                                      // Whether execution was successful
  string error_message = 10;                             // Error message if execution failed
}

// BatchStatistics provides detailed statistics about batch execution
message BatchStatistics {
  uint64 mean_execution_time_ns = 1;                     // Mean execution time per operation
  uint64 median_execution_time_ns = 2;                   // Median execution time per operation
  uint64 p95_execution_time_ns = 3;                      // 95th percentile execution time
  uint64 p99_execution_time_ns = 4;                      // 99th percentile execution time
  uint64 max_execution_time_ns = 5;                      // Maximum execution time
  uint64 min_execution_time_ns = 6;                      // Minimum execution time
  uint64 stdev_execution_time_ns = 7;                    // Standard deviation of execution time
  uint64 total_network_latency_ns = 8;                   // Total network latency
  uint64 total_memory_used = 9;                          // Total memory used
  uint32 dependency_wait_count = 10;                     // Number of operations that had to wait on dependencies
}

// MerkleProofMessage contains proof data for an object in the Merkle tree
message MerkleProofMessage {
  string object_id = 1;
  repeated bytes proof_path = 2;
  bytes root_hash = 3;
  bytes object_hash = 4;
}

// DomainProofMessage contains proof data for a domain
message DomainProofMessage {
  string domain_id = 1;
  MerkleProofMessage proof = 2;
}

// DiffOperation represents the type of operation in a differential update
enum DiffOperation {
  DIFF_OP_ADD = 0;
  DIFF_OP_REMOVE = 1;
  DIFF_OP_MODIFY = 2;
  DIFF_OP_UNCHANGED = 3;
}

// FieldChangeMessage represents a change to a field in a structured object
message FieldChangeMessage {
  string field_path = 1;
  DiffOperation operation = 2;
  bytes previous_value = 3;
  bytes current_value = 4;
}

// ObjectDiffMessage represents changes to a single object
message ObjectDiffMessage {
  string object_id = 1;
  DiffOperation operation = 2;
  bytes previous_hash = 3;
  bytes current_hash = 4;
  int64 size_delta = 5;
  bool is_binary = 6;
  repeated FieldChangeMessage field_changes = 7;
}

// EnhancedDifferentialUpdate represents an optimized state update with Merkle proofs
message EnhancedDifferentialUpdate {
  // Base differential update
  bytes base_snapshot_id = 1;
  bytes target_snapshot_id = 2;
  google.protobuf.Timestamp timestamp = 3;
  
  // Object changes
  map<string, ObjectDiffMessage> object_changes = 4;
  map<string, bytes> state_references = 5;
  map<string, bytes> changed_objects_raw = 6;
  
  // Merkle verification data
  bytes merkle_root = 7;
  repeated DomainProofMessage domain_proofs = 8;
  
  // Metadata
  map<string, string> metadata = 9;
  int64 size = 10;
  bytes checksum = 11;
}

// SyncOptimizedRequest optimizes state sync with domain-based partitioning and gossip
message SyncOptimizedRequest {
  string source_tee_id = 1;
  bytes base_snapshot_id = 2;
  repeated string domains = 3; // Only sync specific domains if provided
  bool force_full_sync = 4;    // Force full sync even if partial sync is possible
  int32 max_diff_size = 5;     // Maximum diff size in bytes (0 = no limit)
}

// SyncOptimizedResponse contains optimized differential updates
message SyncOptimizedResponse {
  string source_tee_id = 1;
  bool success = 2;
  string error_message = 3;
  EnhancedDifferentialUpdate diff_update = 4;
  bool is_partial = 5;          // Whether this is a partial update
  repeated string synced_domains = 6; // Domains included in this update
  google.protobuf.Timestamp sync_time = 7;
}

// GossipSyncMessage enables efficient propagation of updates between peers
message GossipSyncMessage {
  string originator_id = 1;     // Original source TEE ID
  repeated string target_ids = 2; // Intended recipients (empty = broadcast)
  EnhancedDifferentialUpdate diff_update = 3;
  int32 hop_count = 4;         // Number of hops this update has taken
  int32 max_hops = 5;         // Maximum number of hops (TTL)
  google.protobuf.Timestamp timestamp = 6;
}

// BatchProxyExecutionRequest extends BatchDirectExecutionRequest with failover options
message BatchProxyExecutionRequest {
  string sender_id = 1;                                  // ID of the requesting TEE
  repeated BatchOperation operations = 2;                // Batch of operations to execute
  string region_id = 3;                                  // Region ID
  map<string, bytes> shared_parameters = 4;              // Parameters shared across multiple operations
  BatchOptions options = 5;                              // Batch execution options
  
  // Failover specific fields
  string preferred_tee_type = 6;                         // Preferred TEE type (SGX, SEV)
  int32 max_retries = 7;                                 // Maximum number of retries
  repeated string excluded_peers = 8;                    // TEE IDs to exclude
  bool cross_region_allowed = 9;                         // Whether cross-region execution is allowed
}
